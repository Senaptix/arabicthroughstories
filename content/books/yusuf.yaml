# Arabic, NOT a native speaker; never describe him as native. Part 1 is an
# AI voice he checked against the text, so the two parts do not share a
# voice. No TTS remains in this book. Every page now has a human recording
# (page 58 was the last one left); audio_status is a separate, deliberate
# go-live flip, not something a page count changes on its own.
audio_status: none

