# appendix on 60-61 and the word list on 62-68, built in Canva on
# 12 September 2026. The back matter carries no story text, so it is declared
# in non_story_pages below — parse.check.ts demands text for every page
# between 3 and page_count that is not listed there, which is the guard
# working as intended.
page_count: 68
age_range: "7 and up"

# The Amazon listing. LEAVE EMPTY until it is live — the buy button is hidden
# entirely while this is blank rather than pointing nowhere.
