slug: ibrahim
title_en: Who Broke the Idols
title_ar: مَنْ كَسَرَ الْأَصْنَامَ؟
series: qisas-an-nabiyyin
series_order: 1
page_count: 54
age_range: "7-12"

# The Amazon listing. LEAVE EMPTY until it is live — the landing page hides
# the buy button entirely while this is blank rather than showing one that
# goes nowhere. Pasting the URL here is the only change needed to go live.
buy_url: ""
vowelling: full
audio_status: none
# Cover, contents, and the two word-family appendix pages carry no story
# text and so have no per-page glossary or audio clip.
non_story_pages: [1, 2, 53, 54]

# Pages readable in the on-site book preview, from page 1. A PREVIEW, not
# the book: the site is a companion and the full text stays in print.
# Images live in public/book/<slug>/NN.webp.
#
# Rendered from "Qasas an-Nabiyyin - The Story of Ibrahim (AS).pdf" (the
# print master, 54 pages) at 1000px wide. Regenerate from that PDF rather
# than editing the webp files, so the preview cannot drift from what is
# actually printed.
preview_pages: 10

# Sample pages shown on the marketing page. AT MOST TWO — the site is a
# COMPANION to the book (audio, vocabulary, word families), not the book
# itself. Putting the whole text online would deter buying the book.
# Extracted verbatim from the book repo manuscript, never retyped.
sample_pages:
  - page: 39
    ar:
      - "وَلَمَّا أَرَادَ إِبْرَاهِيمُ أَنْ يَذْهَبَ، قَالَتْ هَاجَرُ:"
      - "إِلَى أَيْنَ يَا سَيِّدِي؟ أَتَتْرُكُنِي هُنَا؟"
      - "أَتَتْرُكُنِي وَلَيْسَ هُنَا مَاءٌ وَلَا طَعَامٌ؟"
      - "هَلْ أَمَرَكَ اللهُ بِهَذَا؟"
      - "قَالَ إِبْرَاهِيمُ: نَعَمْ!"
      - "قَالَتْ هَاجَرُ: إِذًا لَا يُضَيِّعُنَا!"
    en:
      - "When Ibrahim was ready to go, Hajar said,"
      - "\"Where are you going, my master? Are you leaving me here?"
      - "Are you leaving me where there is no water and no food?"
      - "Has Allah commanded you to do this?\""
      - "Ibrahim said, \"Yes!\""
      - "Hajar said, \"Then He will never let us be lost!\""

# Read-alongs: narration + the line being read. A SAMPLE, capped at two
# pages — the site is a companion, not the book (see ACCESS_MODEL.md).
# `at` is the second each line starts, measured from the audio with
# ffmpeg silencedetect — never estimated. Re-measure if audio is
# re-recorded.
read_alongs:
  # The animation is the market scene cut out of the branded intro clip
  # (qasas-kids-intro.mp4), from 4.35s on — the logo half is dropped so it
  # loops as scene only, rather than flashing the logo every few seconds
  # under the narration.
  #
  # It replaced an earlier flat-cartoon version on 2026-08-21. That one was
  # the wrong art style for the book — NOT, as first claimed here, a
  # face-rule breach: at native resolution its Azar has no eyes and no
  # nose, only a mouth-like mark inside the beard. Bilinear upscaling of a
  # 608px frame invented the features. Judge this rule at native resolution
  # or with nearest-neighbour magnification, never from a smoothed crop.
  - page: 3
    audio: "/audio/ibrahim/p3.mp3"
    video: "/video/p3-azar-stall.mp4"
    poster: "/video/p3-azar-stall-poster.webp"
    lines:
      - at: 0
        ar: "قَبْلَ أَيَّامٍ كَثِيرَةٍ. كَثِيرَةٍ جِدًّا."
      - at: 4.31
        ar: "كَانَ فِي قَرْيَةٍ رَجُلٌ مَشْهُورٌ جِدًّا."
      - at: 8.99
        ar: "وَكَانَ اسْمُ هَذَا الرَّجُلِ آزَرَ."
      - at: 13.01
        ar: "وَكَانَ آزَرُ يَبِيعُ الْأَصْنَامَ."
  # Page 4 is the companion demo: audio + text + that page's new words,
  # exactly what a reader gets for every page. No artwork — the pictures
  # stay in the book.
  #
  # RESOLVED 2026-08-17 — the narrator does voice the repeated أَصْنَامٌ, so
  # lines 2-3 stay split at 9.12. Three independent things agree:
  #   - the printed text carries أَصْنَامٌ twice (pages.md line 2);
  #   - the speech between the pauses paces at 1.01 s/word read as three
  #     words, against a 0.90 s/word average for this page. Read as two
  #     words it would be 1.52 s/word — 69% slower than the narrator goes
  #     anywhere else here;
  #   - page 3's identical doubled word (كَثِيرَةٍ. كَثِيرَةٍ) was confirmed BY
  #     EAR as spoken twice, and there it was the page TEXT that was wrong.
  # Whisper's "heard it once" is the known ASR failure on repeated words and
  # is outweighed. Kept on record as the one dissent rather than deleted.
  - page: 4
    audio: "/audio/ibrahim/p4.mp3"
    words: true
    lines:
      - at: 0
        ar: "وَكَانَ فِي هٰذِهِ الْقَرْيَةِ بَيْتٌ كَبِيرٌ جِدًّا."
      - at: 5.36
        ar: "وَكَانَ فِي هٰذَا الْبَيْتِ أَصْنَامٌ،"
      - at: 9.12
        ar: "أَصْنَامٌ كَثِيرَةٌ جِدًّا."
      - at: 12.69
        ar: "وَكَانَ النَّاسُ يَسْجُدُونَ لِهٰذِهِ الْأَصْنَامِ."
      - at: 17.58
        ar: "وَكَانَ آزَرُ يَسْجُدُ لِهٰذِهِ الْأَصْنَامِ."
      - at: 22.44
        ar: "وَكَانَ آزَرُ يَعْبُدُ هٰذِهِ الْأَصْنَامَ."
