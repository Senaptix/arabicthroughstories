slug: ibrahim
title_en: Who Broke the Idols
title_ar: مَنْ كَسَرَ الْأَصْنَامَ؟
series: qisas-an-nabiyyin
series_order: 1
page_count: 54
age_range: "7-12"
vowelling: full
audio_status: none
# Cover, contents, and the two word-family appendix pages carry no story
# text and so have no per-page glossary or audio clip.
non_story_pages: [1, 2, 53, 54]

# Pages readable in the on-site book preview, from page 1. A PREVIEW, not
# the book: the site is a companion and the full text stays in print.
# Images live in public/book/<slug>/NN.webp.
preview_pages: 13

# Sample pages shown on the marketing page. AT MOST TWO — the site is a
# COMPANION to the book (audio, vocabulary, word families), not the book
# itself. Putting the whole text online would deter buying the book.
# Extracted verbatim from the book repo manuscript, never retyped.
sample_pages:
  - page: 39
    ar:
      - "وَلَمَّا أَرَادَ إِبْرَاهِيمُ أَنْ يَذْهَبَ، قَالَتْ هَاجَرُ:"
      - "إِلَى أَيْنَ يَا سَيِّدِي؟ أَتَتْرُكُنِي هُنَا؟"
      - "أَتَتْرُكُنِي وَلَيْسَ هُنَا مَاءٌ وَلَا طَعَامٌ؟"
      - "هَلْ أَمَرَكَ اللهُ بِهَذَا؟"
      - "قَالَ إِبْرَاهِيمُ: نَعَمْ!"
      - "قَالَتْ هَاجَرُ: إِذًا لَا يُضَيِّعُنَا!"
    en:
      - "When Ibrahim was ready to go, Hajar said,"
      - "\"Where are you going, my master? Are you leaving me here?"
      - "Are you leaving me where there is no water and no food?"
      - "Has Allah commanded you to do this?\""
      - "Ibrahim said, \"Yes!\""
      - "Hajar said, \"Then He will never let us be lost!\""

# Page 3 read-along: narration + animation + the line being read.
# `at` is the second each line starts, measured from the audio with
# ffmpeg silencedetect — not estimated. Re-measure if the audio is
# ever re-recorded.
read_along:
  page: 3
  video: "/video/p3-azar-stall.mp4"
  poster: "/video/p3-azar-stall-poster.jpg"
  lines:
    - at: 0
      ar: "قَبْلَ أَيَّامٍ كَثِيرَةٍ جِدًّا،"
    - at: 3.16
      ar: "كَانَ فِي قَرْيَةٍ رَجُلٌ مَشْهُورٌ جِدًّا."
    - at: 7
      ar: "وَكَانَ اسْمُ هَذَا الرَّجُلِ آزَرَ."
    - at: 10.57
      ar: "وَكَانَ آزَرُ يَبِيعُ الْأَصْنَامَ."
