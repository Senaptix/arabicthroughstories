# Practice exercises — pages 3-7
#
# GENERATED, then reviewed. Every Arabic string here was resolved from the
# verified corpus (yusuf.pages.md / yusuf.vocabulary.md), never typed.
# lib/parse.check.ts re-checks every token against that corpus on each
# build, so a typo or an invented word fails the build.
#
# The guard proves each WORD is real and correctly spelled. It does NOT
# prove a new COMBINATION is grammatically correct — a case ending right
# in isolation can be wrong in a new position. The `pattern` exercises
# recombine words and still need a native read before they are final.
#
# Page 4's second line is a Qur'anic quotation carrying ﴿ ﴾ and a citation.
# No `order` or `choose` is built from it: reassembling a verse as a word
# puzzle is not appropriate, and the bracket tokens would become draggable
# pieces. See EXERCISE_SPEC.md rule 6.
#
# The vowels here are only as sound as yusuf.pages.md, which has not yet had
# a native check — see the warning at the top of that file.
pages:
  - page: !!int '3'
    exercises:
      - type: 'match'
      - type: 'choose'
        gap: !!int '8'
        answer: 'أَخاً'
        sentence:
          - 'كَانَ'
          - 'يُوسُفُ'
          - 'وَلَداً'
          - 'صَغِيراً،'
          - 'وَكَانَ'
          - 'لَهُ'
          - 'أَحَدَ'
          - 'عَشَرَ'
          - 'أَخاً.'
        options:
          - 'أَخاً'
          - 'كَوْكَباً'
          - 'وَلَداً'
      - type: 'order'
        answer:
          - 'ذَاتَ'
          - 'لَيْلَةٍ'
          - 'رَأَى'
          - 'يُوسُفُ'
          - 'رُؤْيَا'
          - 'عَجِيبَةً.'
      - type: 'pattern'
        stem:
          - 'رَأَى'
          - 'يُوسُفُ'
        options:
          - ar: 'الشَّمْسَ'
            en: 'the sun'
          - ar: 'الْقَمَرَ'
            en: 'the moon'
          - ar: 'كَوْكَباً'
            en: 'a star'
      - type: 'question'
        ar: 'مَنْ رَأَى رُؤْيَا عَجِيبَةً؟'
        en: 'Who saw a strange dream?'
        answer: 'يُوسُفُ'
        options:
          - 'يُوسُفُ'
          - 'يَعْقُوبُ'
          - 'الشَّمْسُ'
