# Practice exercises — pages 3-12
#
# GENERATED, then reviewed. Every Arabic string here was resolved from the
# verified corpus (ibrahim.pages.md / ibrahim.vocabulary.md), never typed.
# lib/parse.check.ts re-checks every token against that corpus on each
# build, so a typo or an invented word fails the build.
#
# The guard proves each WORD is real and correctly spelled. It does NOT
# prove a new COMBINATION is grammatically correct — a case ending right
# in isolation can be wrong in a new position. The `pattern` exercises
# recombine words and still need a native read before they are final.
#
# `match` carries no content: it is built at render time from that page's
# vocabulary entries (capped at 5 pairs so it stays usable on a phone).
